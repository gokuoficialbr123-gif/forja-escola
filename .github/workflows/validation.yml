name: Validar frontend FORJA

on:
  push:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    permissions:
      contents: read
      checks: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validar release, hash e JavaScript
        run: node scripts/validate.mjs
      - name: Diagnóstico projetado read-only, sem tokens Google
        if: github.event_name == 'push' && github.ref_name == 'fix/secretaria-booking-past-google-2026-10-13'
        env:
          AUDIT_FIREBASE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FORJA_ESCOLA }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm install --prefix /tmp/forja-readonly --no-save --package-lock=false firebase-admin@13.6.0
          node scripts/booking-google-metadata-audit.mjs
      - name: Testar proteções do pipeline
        run: node --test scripts/pipeline.test.mjs
      - name: Instalar Chromium para regressões do drawer
        run: |
          npm install --prefix /tmp/forja-browser-tests --no-save --package-lock=false playwright@1.56.1
          /tmp/forja-browser-tests/node_modules/.bin/playwright install --with-deps chromium
      - name: Testar drawer e Agenda Secretaria em navegador real
        env:
          FORJA_PLAYWRIGHT_MODULE: /tmp/forja-browser-tests/node_modules/playwright/index.mjs
        run: node --test scripts/secretaria-drawer.test.mjs scripts/availability-publication.test.mjs scripts/secretaria-agenda.test.mjs scripts/secretaria-agenda-visual.test.mjs scripts/google-secretaria.test.mjs scripts/google-secretaria-navigation.test.mjs scripts/new-user-modal.test.mjs scripts/invitation-demo.test.mjs scripts/availability-session.test.mjs
      - name: Preparar artefato isolado
        run: node scripts/prepare-hosting.mjs
