name: Validar frontend FORJA

on:
  push:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # TEMPORARY. Remove this job and scripts/temporary-* before merge.
  # No server import/start, Auth, migration, Google, scheduling or database writes.
  read-only-firestore-audit:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/fix/secretaria-drawer-6.31.0'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Instalar SDK isolado sem alterar portal
        run: npm install --prefix /tmp/forja-readonly-tools --no-save --package-lock=false --no-audit --no-fund firebase-admin@13.10.0
      - name: Conferir barreiras de leitura e redação
        run: node scripts/temporary-firestore-audit.mjs --self-test
      - name: Auditar somente leituras do projeto existente
        env:
          FORJA_AUDIT_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FORJA_ESCOLA }}
          FORJA_ADMIN_MODULE: /tmp/forja-readonly-tools/node_modules/firebase-admin/lib/index.js
        run: node scripts/temporary-firestore-audit.mjs

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validar release, hash e JavaScript
        run: node scripts/validate.mjs
      - name: Testar proteções do pipeline
        run: node --test scripts/pipeline.test.mjs
      - name: Instalar Chromium para regressões do drawer
        run: |
          npm install --prefix /tmp/forja-browser-tests --no-save --package-lock=false playwright@1.56.1
          /tmp/forja-browser-tests/node_modules/.bin/playwright install --with-deps chromium
      - name: Testar drawer Secretaria em navegador real
        env:
          FORJA_PLAYWRIGHT_MODULE: /tmp/forja-browser-tests/node_modules/playwright/index.mjs
        run: node --test scripts/secretaria-drawer.test.mjs scripts/availability-publication.test.mjs
      - name: Preparar artefato isolado
        run: node scripts/prepare-hosting.mjs
